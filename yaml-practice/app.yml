services:
  api:
    image: python:3-slim
    command: python -m http.server 5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - backend

  db:
   image: postgres:16
   environment:
     POSTGRES_USER: admin
     POSTGRES_PASSWORD: secret
   volumes:
     - dbdata:/var/lib/postgresql/data
   networks:
     - backend

  proxy:
    image: nginx:latest
    ports:
      - "8082:80"
    volumes: 
      - ./html:/usr/share/nginx/html
    networks:
      - backend

volumes:
  dbdata:
networks:
  backend:

  