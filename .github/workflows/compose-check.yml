name: Compose check
on: 
  push:
    branches: [main]
    paths: ['yaml-practice/**']
  pull_request:
    paths: 'yaml-practice/**'
jobs:
  compose-check:
    runs-on: ubuntu-latest
    steps:
     - name: Check out the code
       uses: actions/checkout@v4
     - name: Validate each Comopose file
       run: |
         for file in yaml-practice/*.yml; do
           echo "==$file"
           docker compose -f "$file" config > /dev/null
         done
