name: Terraform fmt
on:
  push:
    branches: [main]
  pull_request:
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      name: Check formatting
      run: terraform fmt-check -recursive
