name: Round 3
on: push
jobs:
  compose-check:
      runs-on: ubuntu-latest
      steps:
         - name: Check out the code
           uses: actions/checkout@v4
         - name: Validate each Compose file
           run: |
             for file in yaml-practice/*.yml; do
                echo "==$file"
                docker compose -f "$file" config > /dev/null
             done
