name: Two jobs
on:

  workflow_dispatch
jobs:
  build:
     runs-on: ubuntu-latest
     steps:
       - name: Checkout code
         uses: actions/checkour@v4
       - name: List docker-demo files
         run: ls docker-demo
  report:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Print report
        run: echo "Build passed, triggered by ${{ github.actor }} on ${{ github.ref_name }}"
